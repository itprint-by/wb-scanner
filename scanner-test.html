<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ITPRINT Scanner Test</title><style>body{background:#101722;color:#eee;font:16px system-ui;margin:12px}video{width:100%;max-height:42vh;object-fit:contain;background:#000}button,select{font:inherit;padding:12px;margin:4px;background:#253349;color:white;border:1px solid #53627a;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1b2533;padding:12px}#result{font-size:23px;color:#8cf0b5;overflow-wrap:anywhere}</style><h2>ITPRINT · Тест сканера</h2><select id="engine"><option value="zx">ZXing JS</option><option value="wasm">ZXing WASM</option><option value="q">Quagga2</option><option value="native">BarcodeDetector</option></select><button id="start">Запустить / сменить движок</button><video id="video" autoplay muted playsinline></video><div id="result">Ожидание кода</div><pre id="info">Нажмите «Запустить»</pre><button id="copy">Копировать диагностику</button><script>
const $=id=>document.getElementById(id),v=$('video'),c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});let stream,gen=0,frames=0,hits=0,last='',err='',mode='',decoder,started=0;const scripts={};function load(url){return scripts[url] ||= new Promise((ok,no)=>{const s=document.createElement('script');s.src=url;s.onload=ok;s.onerror=()=>no(Error('Не загрузилась библиотека '+url));document.head.append(s)})}function report(){const t=stream?.getVideoTracks()[0];$('info').textContent=`Движок: ${mode}\nВидео: ${v.videoWidth} × ${v.videoHeight}\nКадров обработано: ${frames}\nУспешных чтений: ${hits}\nПоследний код: ${last||'—'}\nПоследнее сообщение: ${err||'—'}\nКамера: ${t?.label||'—'}`;}function found(code,format){if(!code)return;hits++;last=String(code);$('result').textContent=last+' · '+format;err='Код распознан';}async function start(){const token=++gen;stream?.getTracks().forEach(t=>t.stop());stream=null;frames=hits=0;last=err='';$('result').textContent='Ожидание кода';mode=$('engine').value;report();try{let decode;if(mode==='zx'){await load('https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js');const Z=window.ZXing,h=new Map();h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.EAN_13]);h.set(Z.DecodeHintType.TRY_HARDER,true);const r=new Z.MultiFormatReader();r.setHints(h);decode=async()=>{const p=ctx.getImageData(0,0,c.width,c.height).data,g=new Uint8ClampedArray(c.width*c.height);for(let i=0;i<g.length;i++)g[i]=(p[i*4]+2*p[i*4+1]+p[i*4+2])/4;const b=new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.RGBLuminanceSource(g,c.width,c.height)));const a=r.decodeWithState(b);found(a.getText(),Z.BarcodeFormat[a.getBarcodeFormat()]);};}else if(mode==='wasm'){const w=await import('https://esm.sh/zxing-wasm@2.2.0/reader');decode=async()=>{const results=await w.readBarcodes(ctx.getImageData(0,0,c.width,c.height),{formats:['Code128','EAN13'],tryHarder:true,tryRotate:true});for(const a of results)found(a.text,a.format);if(!results.length)err='Код не найден в кадре';};}else if(mode==='q'){await load('https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js');decode=()=>new Promise(resolve=>{window.Quagga.decodeSingle({src:c.toDataURL('image/png'),numOfWorkers:0,locate:true,inputStream:{size:960},decoder:{readers:['code_128_reader','ean_reader']}},a=>{if(a?.codeResult)found(a.codeResult.code,a.codeResult.format);else err='Код не найден в кадре';resolve()})});}else{if(!window.BarcodeDetector)throw Error('BarcodeDetector недоступен');const formats=(await BarcodeDetector.getSupportedFormats()).filter(x=>['code_128','ean_13'].includes(x));if(!formats.length)throw Error('Нет нужных форматов');const d=new BarcodeDetector({formats});decode=async()=>{const a=await d.detect(c);for(const x of a)found(x.rawValue,x.format);if(!a.length)err='Код не найден в кадре';};}if(token!==gen)return;const s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});if(token!==gen){s.getTracks().forEach(t=>t.stop());return}stream=s;v.srcObject=s;await v.play();async function tick(){if(token!==gen)return;if(v.readyState>=2&&v.videoWidth){c.width=v.videoWidth;c.height=v.videoHeight;ctx.drawImage(v,0,0);frames++;try{await decode()}catch(e){err=e.name+': '+(e.message||'Код не найден')}report()}if(token===gen)setTimeout(tick,180)}tick();}catch(e){err=String(e);report()}}$('start').onclick=start;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('info').textContent)}catch{alert('Сделайте скриншот диагностики')}};window.addEventListener('pagehide',()=>{gen++;stream?.getTracks().forEach(t=>t.stop())});</script></html>
