:root{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;--bg:#111827;--panel:#1f2937;--text:#f9fafb;--muted:#9ca3af;--line:#374151;--accent:#2563eb}
body.light{--bg:#f3f5f9;--panel:#ffffff;--text:#1f2937;--muted:#64748b;--line:#dbe2ea}

</style></head><body><main><header><div><h1>WB Barcode Scanner <span style="font-size:12px;color:var(--muted)">Lite 5.1</span></h1><small id="catalogInfo">Загрузка каталога…</small></div><button id="settings" aria-label="Настройки">⚙</button><button id="theme" aria-label="Сменить тему">☀ / ☾</button></header>
<div class="toprow"><div class="readerWrap"><div id="reader"></div><div class="cameraBadge">● Камера</div><div class="cameraControls"><button class="secondary" id="torch" aria-label="Фонарик">🔦</button><button class="secondary" id="expand">⛶</button></div></div><div class="details"><div id="status" role="status">Наведите штрихкод</div><div class="articleLabel">Артикул продавца</div><div class="article" id="article">—</div><div class="barcodeLine" id="shownCode">—</div></div></div>

<section id="settingsPanel" class="searchPanel settingsPanel hidden"><button class="secondary" id="closeSettings">← Назад</button><h2>Настройки</h2><label>Движок <select id="engine"><option value="wasm">ZXing WASM</option><option value="q">Quagga2</option><option value="zx">ZXing JS</option></select></label><label>Повторное чтение <select id="interval"><option value="500">0,5 с</option><option value="1000">1 с</option><option value="1500">1,5 с</option><option value="2000">2 с</option></select></label><label><input type="checkbox" id="sound"> Звук</label><label><input type="checkbox" id="vibrate"> Вибрация</label><label><input type="checkbox" id="diagnostics"> Диагностика</label><label><input type="checkbox" id="remember"> Запоминать настройки</label><pre id="diag"></pre><button class="secondary" id="restart">Перезапустить камеру</button></section><section id="manual" class="searchPanel hidden"><button class="secondary" id="closeSearch">← Назад</button><h2>Поиск товара</h2><input id="barcode" autocomplete="off" placeholder="Артикул или баркод"><div id="results"></div></section><div class="foot" id="cameraInfo">Для камеры нужен HTTPS и разрешение браузера.</div></main><script>
let catalog={},last='',photoUrls=[],photoIndex=0,requestId=0,scanner;const el=id=>document.getElementById(id);const ranges=[[143,1],[287,2],[431,3],[719,4],[1007,5],[1061,6],[1115,7],[1169,8],[1313,9],[1601,10],[1655,11],[1919,12],[2045,13],[2189,14],[2405,15],[2621,16],[2837,17],[3053,18],[3269,19],[3485,20],[3701,21],[3917,22],[4133,23],[4349,24],[4565,25],[4781,26],[4997,27],[5213,28],[5429,29],[5645,30]];
function setStatus(message,kind=''){el('status').textContent=message;el('status').className=kind}function resetPhoto(message){el('photo').innerHTML='<div class="placeholder"></div>';el('photo').firstChild.textContent=message;el('counter').textContent='—'}function urlFor(id,basket,n){const v=Math.floor(id/100000),p=Math.floor(id/1000);return `https://basket-${String(basket).padStart(2,'0')}.wbbasket.ru/vol${v}/part${p}/${id}/images/big/${n}.webp`}
function loadImg(url,timeout=3200){return new Promise(resolve=>{const img=new Image();let done=false;const finish=ok=>{if(done)return;done=true;clearTimeout(timer);img.onload=img.onerror=null;resolve(ok)};const timer=setTimeout(()=>finish(false),timeout);img.onload=()=>finish(true);img.onerror=()=>finish(false);img.src=url})}
async function getBasket(id,token){let v=Math.floor(id/100000),candidate=(ranges.find(r=>v<=r[0])||[])[1];let order=[candidate,...Array.from({length:40},(_,i)=>i+1)].filter((x,i,a)=>x&&a.indexOf(x)===i);for(const b of order){if(token!==requestId)return null;if(await loadImg(urlFor(id,b,1),1800))return b}return null}
function renderPhoto(){if(!photoUrls.length){resetPhoto('Фотографии не найдены');return}const image=document.createElement('img');image.alt='Фотография товара';image.src=photoUrls[photoIndex];image.onerror=()=>{if(el('photo').contains(image))resetPhoto('Ошибка загрузки фотографии')};el('photo').replaceChildren(image);el('counter').textContent=`${photoIndex+1} из ${photoUrls.length}`}
async function show(code){code=String(code).trim();if(!code)return;if(code===last)return;last=code;el('shownCode').textContent=code;const token=++requestId;photoUrls=[];photoIndex=0;el('article').textContent='—';resetPhoto('Поиск товара…');const item=catalog[code];if(!item){setStatus('ШТРИХКОД НЕ НАЙДЕН','bad');resetPhoto('Нет товара в справочнике');return}el('article').textContent=item.seller;setStatus('ТОВАР НАЙДЕН','ok');const basket=await getBasket(item.wb,token);if(token!==requestId)return;if(!basket){setStatus('ТОВАР НАЙДЕН · фотографии недоступны','wait');resetPhoto('Не удалось получить фотографии с WB');return}photoUrls=[urlFor(item.wb,basket,1)];renderPhoto();for(let i=2;i<=20;i++){if(token!==requestId)return;const url=urlFor(item.wb,basket,i);if(await loadImg(url,1400)){if(token!==requestId)return;photoUrls.push(url);el('counter').textContent=`${photoIndex+1} из ${photoUrls.length}`}else break}}
let recentCode='',recentAt=0,unknownCode='',unknownAt=0,unknownHits=0,audio;
function beep(){try{if(!audio||audio.state!=='running')return;const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=880;g.gain.value=.08;o.start();o.stop(audio.currentTime+.12)}catch{}}
document.addEventListener('pointerdown',()=>{try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{}},{passive:true});
function onScan(raw){if(!el('manual').classList.contains('hidden')||!el('settingsPanel').classList.contains('hidden'))return;const code=String(raw).trim();if(!code)return;const now=Date.now();if(code===recentCode&&now-recentAt<Number(el('interval').value))return;
if(!catalog[code]){if(!/^\d{13}$/.test(code))return;if(code===unknownCode&&now-unknownAt<1800)unknownHits++;else{unknownCode=code;unknownHits=1}unknownAt=now;if(unknownHits<3)return;}
unknownHits=0;recentCode=code;recentAt=now;if(catalog[code]){if(el('sound').checked)beep();if(el('vibrate').checked)navigator.vibrate?.(60);setExpanded(false)}if(code!==last)show(code);
}
const video=document.createElement('video');video.autoplay=true;video.muted=true;video.playsInline=true;video.style.cssText='width:100%;height:100%;object-fit:contain;display:block';el('reader').append(video);function cameraNote(message){el('cameraInfo').textContent=message;document.querySelector('.cameraBadge').textContent=message;}
const $=id=>document.getElementById(id),v=video,c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});let stream,gen=0,frames=0,hits=0,lastDecoded='',err='',mode='',decoder,started=0;const scripts={};function load(url){return scripts[url] ||= new Promise((ok,no)=>{const s=document.createElement('script');s.src=url;s.onload=ok;s.onerror=()=>no(Error('Не загрузилась библиотека '+url));document.head.append(s)})}function report(){const t=stream?.getVideoTracks()[0];$('diag').textContent=`Движок: ${mode}\nВидео: ${v.videoWidth} × ${v.videoHeight}\nКадров обработано: ${frames}\nУспешных чтений: ${hits}\nПоследний код: ${lastDecoded||'—'}\nПоследнее сообщение: ${err||'—'}\nКамера: ${t?.label||'—'}`;}function found(code,format){if(!code)return;hits++;lastDecoded=String(code);onScan(lastDecoded);err='Код распознан';}async function start(){const token=++gen;stream?.getTracks().forEach(t=>t.stop());stream=null;frames=hits=0;lastDecoded=err='';cameraNote('Запуск камеры…');mode=$('engine').value;report();try{let decode;if(mode==='zx'){await load('https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js');const Z=window.ZXing,h=new Map();h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.EAN_13]);h.set(Z.DecodeHintType.TRY_HARDER,true);const r=new Z.MultiFormatReader();r.setHints(h);decode=async()=>{const p=ctx.getImageData(0,0,c.width,c.height).data,g=new Uint8ClampedArray(c.width*c.height);for(let i=0;i<g.length;i++)g[i]=(p[i*4]+2*p[i*4+1]+p[i*4+2])/4;const b=new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.RGBLuminanceSource(g,c.width,c.height)));const a=r.decodeWithState(b);found(a.getText(),Z.BarcodeFormat[a.getBarcodeFormat()]);};}else if(mode==='wasm'){const w=await import('https://esm.sh/zxing-wasm@2.2.0/reader');decode=async()=>{const results=await w.readBarcodes(ctx.getImageData(0,0,c.width,c.height),{formats:['Code128','EAN13'],tryHarder:true,tryRotate:true});const a=results.find(a=>catalog[String(a.text).trim()])||results[0];if(a)found(a.text,a.format);if(!results.length)err='Код не найден в кадре';};}else if(mode==='q'){await load('https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js');decode=()=>new Promise(resolve=>{window.Quagga.decodeSingle({src:c.toDataURL('image/png'),numOfWorkers:0,locate:true,inputStream:{size:960},decoder:{readers:['code_128_reader','ean_reader']}},a=>{if(a?.codeResult)found(a.codeResult.code,a.codeResult.format);else err='Код не найден в кадре';resolve()})});}else{if(!window.BarcodeDetector)throw Error('BarcodeDetector недоступен');const formats=(await BarcodeDetector.getSupportedFormats()).filter(x=>['code_128','ean_13'].includes(x));if(!formats.length)throw Error('Нет нужных форматов');const d=new BarcodeDetector({formats});decode=async()=>{const a=await d.detect(c);for(const x of a)found(x.rawValue,x.format);if(!a.length)err='Код не найден в кадре';};}if(token!==gen)return;const s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});if(token!==gen){s.getTracks().forEach(t=>t.stop());return}stream=s;v.srcObject=s;await v.play();setupTorch();cameraNote('Камера активна · '+mode);async function tick(){if(token!==gen)return;if(v.readyState>=2&&v.videoWidth){c.width=v.videoWidth;c.height=v.videoHeight;ctx.drawImage(v,0,0);frames++;try{await decode()}catch(e){err=e.name+': '+(e.message||'Код не найден')}report()}if(token===gen)setTimeout(tick,180)}tick();}catch(e){err=String(e);cameraNote(err);report()}}function setExpanded(v){document.querySelector('.readerWrap').classList.toggle('expanded',v);el('expand').textContent=v?'Свернуть':'⛶'}
el('expand').onclick=()=>setExpanded(!document.querySelector('.readerWrap').classList.contains('expanded'));
let torchOn=false;function setupTorch(){const track=video.srcObject?.getVideoTracks()[0];torchOn=false;el('torch').disabled=!track?.getCapabilities?.().torch;el('torch').textContent='🔦';el('torch').onclick=async()=>{try{await track.applyConstraints({advanced:[{torch:!torchOn}]});torchOn=!torchOn;el('torch').textContent=torchOn?'🔦 Вкл':'🔦'}catch{cameraNote('Фонарь недоступен')}}}
function search(){const q=el('barcode').value.trim().toLowerCase();const box=el('results');box.replaceChildren();if(!q)return;const matches=Object.entries(catalog).filter(([code,item])=>code.includes(q)||String(item.seller).toLowerCase().includes(q));for(const [code,item] of matches.slice(0,100)){const b=document.createElement('button');b.className='secondary result';b.textContent=item.seller+' · '+code;b.onclick=()=>{el('manual').classList.add('hidden');last='';show(code)};box.append(b)}if(!matches.length)box.textContent='Ничего не найдено';}
el('barcode').oninput=search;el('toggleManual').onclick=()=>{el('manual').classList.remove('hidden');el('barcode').focus();search()};el('closeSearch').onclick=()=>el('manual').classList.add('hidden');el('prev').onclick=()=>{if(photoUrls.length){photoIndex=(photoIndex+photoUrls.length-1)%photoUrls.length;renderPhoto()}};el('next').onclick=()=>{if(photoUrls.length){photoIndex=(photoIndex+1)%photoUrls.length;renderPhoto()}};let x=0;el('photo').addEventListener('touchstart',e=>x=e.changedTouches[0].clientX,{passive:true});el('photo').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x;if(Math.abs(d)>45)(d<0?el('next'):el('prev')).click()},{passive:true});el('theme').onclick=()=>{document.body.classList.toggle('light');localStorage.setItem('wb-theme',document.body.classList.contains('light')?'light':'dark')};if(localStorage.getItem('wb-theme')==='light')document.body.classList.add('light');const defaults={engine:'wasm',interval:'1000',sound:true,vibrate:true,diagnostics:false,remember:true};let saved={};try{saved=JSON.parse(localStorage.getItem('wb-settings-v5')||'{}')}catch{};for(const [k,d] of Object.entries(defaults)){const e=el(k),value=saved[k]??d;if(typeof d==='boolean')e.checked=value;else e.value=value;e.onchange=()=>{saveSettings();if(k==='engine')start();}}function saveSettings(){const o={};for(const [k,d] of Object.entries(defaults))o[k]=typeof d==='boolean'?el(k).checked:el(k).value;try{if(o.remember)localStorage.setItem('wb-settings-v5',JSON.stringify(o));else localStorage.removeItem('wb-settings-v5')}catch{}el('diag').hidden=!o.diagnostics;}saveSettings();el('settings').onclick=()=>el('settingsPanel').classList.remove('hidden');el('closeSettings').onclick=()=>el('settingsPanel').classList.add('hidden');el('restart').onclick=start;window.addEventListener('pagehide',()=>{gen++;stream?.getTracks().forEach(t=>t.stop());stream=null});window.addEventListener('pageshow',e=>{if(e.persisted)start()});
fetch('catalog.json?v=5',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{catalog=data;el('catalogInfo').textContent=`В справочнике ${Object.keys(data).length} штрихкодов`;start()}).catch(e=>{setStatus('Ошибка загрузки справочника: '+e.message,'bad');start()});
</script></body></html>
