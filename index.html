<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101722"><title>WB Barcode Scanner Lite v2.4 — вариант А</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark;--bg:#101722;--panel:#1b2533;--text:#f4f7fc;--muted:#9caec3;--line:#344155}
body.light{color-scheme:light;--bg:#f3f6fb;--panel:#fff;--text:#15202d;--muted:#607184;--line:#d9e1eb}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text)}button{cursor:pointer;touch-action:manipulation} .hidden{display:none!important}
main{width:100%;max-width:600px;margin:auto;height:100vh;height:100dvh;min-height:450px;display:flex;flex-direction:column;gap:9px;padding:calc(10px + env(safe-area-inset-top)) 12px calc(9px + env(safe-area-inset-bottom));overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:0 0 auto}h1{font-size:19px;margin:0;letter-spacing:-.5px}small,.muted{color:var(--muted)}header button,.secondary{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:9px 12px}
.toprow{display:flex;flex-direction:column;gap:8px;flex:0 0 auto;min-height:0;height:auto}.details{display:flex;flex-direction:row;align-items:center;gap:10px;min-width:0}.details .articleLabel{display:none}#status{flex:0 0 auto;max-width:48%;border-radius:10px;padding:9px 10px;background:var(--panel);font-size:clamp(11px,3.1vw,14px);font-weight:800;line-height:1.2;overflow-wrap:anywhere}#status.ok{background:#123d2b;color:#8cf0b5}#status.bad{background:#4a1d25;color:#ffb0bd}#status.wait{background:#42331c;color:#ffd68c}.article{flex:1;min-width:0;font-size:clamp(18px,5vw,25px);font-weight:780;overflow-wrap:anywhere;line-height:1.15}.readerWrap{background:#080d13;border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative;width:100%;height:clamp(145px,23dvh,205px);flex:0 0 auto}#reader{width:100%;height:100%;overflow:hidden}#reader video{width:100%!important;height:100%!important;object-fit:cover!important}#reader img{max-width:100%}#reader button,#reader select{font-size:11px;max-width:100%}.cameraBadge{position:absolute;top:7px;right:7px;background:#0b101bc9;color:#d8e8f5;border-radius:7px;padding:4px 6px;font-size:10px;pointer-events:none}
.photo{flex:1 1 auto;min-height:0;position:relative;border-radius:14px;background:var(--panel);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y}.photo img{display:block;width:100%;height:100%;object-fit:contain}.placeholder{color:var(--muted);text-align:center;padding:20px;font-size:14px}
.bottom{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px}.gallery{display:flex;align-items:center;justify-content:center;gap:8px}.gallery button{font-size:23px;min-width:43px;min-height:43px;padding:4px}.gallery span{font-size:14px;min-width:45px;text-align:center}.primary{background:#6a60ee;color:white;border:0;border-radius:11px;padding:11px 14px;font-weight:700}.keyboard{font-size:21px;min-width:46px;min-height:44px}.inputrow{display:flex;gap:8px;flex:0 0 auto}.inputrow input{min-width:0;flex:1;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px;color:var(--text);font-size:16px}.foot{font-size:11px;color:var(--muted);text-align:center;flex:0 0 auto}
@media(max-height:690px){main{gap:6px;padding-top:calc(5px + env(safe-area-inset-top));padding-bottom:calc(5px + env(safe-area-inset-bottom))}.readerWrap{height:clamp(125px,20dvh,155px)}h1{font-size:17px}.foot{display:none}.gallery button{min-height:38px;min-width:38px}.keyboard{min-height:38px}}
@media(max-width:350px){#status{max-width:50%}#status{padding:8px 6px}.gallery{gap:3px}.gallery span{min-width:38px;font-size:12px}}
</style></head><body><main><header><div><h1>WB Scanner <span style="font-size:12px;color:var(--muted)">Lite</span></h1><small id="catalogInfo">Загрузка каталога…</small></div><button id="theme" aria-label="Сменить тему">☀ / ☾</button></header>
<div class="toprow"><div class="readerWrap"><div id="reader"></div><div class="cameraBadge">● Камера</div></div><div class="details"><div id="status" role="status">Наведите штрихкод</div><div class="article" id="article">—</div></div></div>
<div class="photo" id="photo"><div class="placeholder">Здесь появится фотография товара</div></div>
<div class="bottom"><button class="secondary keyboard" id="toggleManual" aria-label="Ручной ввод штрихкода" aria-expanded="false">⌨</button><div class="gallery"><button class="secondary" id="prev" aria-label="Предыдущее фото">‹</button><span id="counter" class="muted">—</span><button class="secondary" id="next" aria-label="Следующее фото">›</button></div></div>
<form class="inputrow hidden" id="manual"><input id="barcode" inputmode="numeric" autocomplete="off" placeholder="Введите штрихкод вручную" aria-label="Штрихкод"><button class="primary" type="submit">Найти</button></form><div class="foot" id="cameraInfo">Для камеры нужен HTTPS и разрешение браузера.</div></main><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script>
let catalog={},last='',photoUrls=[],photoIndex=0,requestId=0,scanner;const el=id=>document.getElementById(id);const ranges=[[143,1],[287,2],[431,3],[719,4],[1007,5],[1061,6],[1115,7],[1169,8],[1313,9],[1601,10],[1655,11],[1919,12],[2045,13],[2189,14],[2405,15],[2621,16],[2837,17],[3053,18],[3269,19],[3485,20],[3701,21],[3917,22],[4133,23],[4349,24],[4565,25],[4781,26],[4997,27],[5213,28],[5429,29],[5645,30]];
function setStatus(message,kind=''){el('status').textContent=message;el('status').className=kind}function resetPhoto(message){el('photo').innerHTML='<div class="placeholder"></div>';el('photo').firstChild.textContent=message;el('counter').textContent='—'}function urlFor(id,basket,n){const v=Math.floor(id/100000),p=Math.floor(id/1000);return `https://basket-${String(basket).padStart(2,'0')}.wbbasket.ru/vol${v}/part${p}/${id}/images/big/${n}.webp`}
function loadImg(url,timeout=3200){return new Promise(resolve=>{const img=new Image();let done=false;const finish=ok=>{if(done)return;done=true;clearTimeout(timer);img.onload=img.onerror=null;resolve(ok)};const timer=setTimeout(()=>finish(false),timeout);img.onload=()=>finish(true);img.onerror=()=>finish(false);img.src=url})}
async function getBasket(id,token){let v=Math.floor(id/100000),candidate=(ranges.find(r=>v<=r[0])||[])[1];let order=[candidate,...Array.from({length:40},(_,i)=>i+1)].filter((x,i,a)=>x&&a.indexOf(x)===i);for(const b of order){if(token!==requestId)return null;if(await loadImg(urlFor(id,b,1),1800))return b}return null}
function renderPhoto(){if(!photoUrls.length){resetPhoto('Фотографии не найдены');return}const image=document.createElement('img');image.alt='Фотография товара';image.src=photoUrls[photoIndex];image.onerror=()=>{if(el('photo').contains(image))resetPhoto('Ошибка загрузки фотографии')};el('photo').replaceChildren(image);el('counter').textContent=`${photoIndex+1} из ${photoUrls.length}`}
async function show(code){code=String(code).trim();if(!code)return;if(code===last)return;last=code;const token=++requestId;photoUrls=[];photoIndex=0;el('article').textContent='—';resetPhoto('Поиск товара…');const item=catalog[code];if(!item){setStatus('ШТРИХКОД НЕ НАЙДЕН','bad');resetPhoto('Нет товара в справочнике');return}el('article').textContent=item.seller;setStatus('ТОВАР НАЙДЕН','ok');const basket=await getBasket(item.wb,token);if(token!==requestId)return;if(!basket){setStatus('ТОВАР НАЙДЕН · фотографии недоступны','wait');resetPhoto('Не удалось получить фотографии с WB');return}photoUrls=[urlFor(item.wb,basket,1)];renderPhoto();for(let i=2;i<=20;i++){if(token!==requestId)return;const url=urlFor(item.wb,basket,i);if(await loadImg(url,1400)){photoUrls.push(url);el('counter').textContent=`${photoIndex+1} из ${photoUrls.length}`}else break}}
// В каталоге EAN-13: проверяем контрольную цифру, чтобы не показывать ложные ошибки.
function validEan13(s){if(!/^\d{13}$/.test(s))return false;let sum=0;for(let i=0;i<12;i++)sum+=Number(s[i])*(i%2?3:1);return (10-sum%10)%10===Number(s[12])}
let recentCode='',recentAt=0,unknownCode='',unknownAt=0,unknownHits=0;
function onScan(raw){
 const code=String(raw).trim();if(!validEan13(code))return;
 const now=Date.now();
 if(!catalog[code]){
   // Не заменяем найденный товар случайным ошибочным чтением.
   if(code===unknownCode&&now-unknownAt<1800)unknownHits++;
   else {unknownCode=code;unknownHits=1;}
   unknownAt=now;
   if(unknownHits>=3&&now-recentAt>1200&&!catalog[last]){setStatus('ШТРИХКОД НЕ НАЙДЕН','bad');el('cameraInfo').textContent='Считан код: '+code+' · проверьте этикетку';unknownHits=0;}
   return;
 }
 unknownCode='';unknownHits=0;
 if(code===recentCode&&now-recentAt<1500)return;
 recentCode=code;recentAt=now;
 if(code===last)last='';
 show(code);
}
async function start(){
 if(!window.Html5Qrcode){el('cameraInfo').textContent='Не удалось загрузить библиотеку камеры. Проверьте интернет.';return}
 try{
  scanner=new Html5Qrcode('reader',{verbose:false,formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13],useBarCodeDetectorIfSupported:true});
  await scanner.start({facingMode:'environment'},
    {fps:20,videoConstraints:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}},aspectRatio:1.777778,disableFlip:true},
    onScan,()=>{});
  el('cameraInfo').textContent='Камера активна · поднесите штрихкод горизонтально';
 }catch(e){el('cameraInfo').textContent='Камера недоступна: '+(e?.message||e)+'. Можно ввести штрихкод вручную.'}
}
el('toggleManual').onclick=()=>{const hidden=el('manual').classList.toggle('hidden');el('toggleManual').setAttribute('aria-expanded',String(!hidden));if(!hidden)el('barcode').focus()};el('manual').onsubmit=e=>{e.preventDefault();last='';show(el('barcode').value);el('manual').classList.add('hidden');el('toggleManual').setAttribute('aria-expanded','false');el('barcode').blur()};el('prev').onclick=()=>{if(photoUrls.length){photoIndex=(photoIndex+photoUrls.length-1)%photoUrls.length;renderPhoto()}};el('next').onclick=()=>{if(photoUrls.length){photoIndex=(photoIndex+1)%photoUrls.length;renderPhoto()}};let x=0;el('photo').addEventListener('touchstart',e=>x=e.changedTouches[0].clientX,{passive:true});el('photo').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x;if(Math.abs(d)>45)(d<0?el('next'):el('prev')).click()},{passive:true});el('theme').onclick=()=>{document.body.classList.toggle('light');localStorage.setItem('wb-theme',document.body.classList.contains('light')?'light':'dark')};if(localStorage.getItem('wb-theme')==='light')document.body.classList.add('light');fetch('catalog.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{catalog=data;el('catalogInfo').textContent=`В справочнике ${Object.keys(data).length} штрихкодов`;start()}).catch(e=>{setStatus('Ошибка загрузки справочника: '+e.message,'bad');start()});
</script></body></html>
