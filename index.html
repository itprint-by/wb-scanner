<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101722"><title>WB Barcode Scanner Lite</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark;--bg:#101722;--panel:#1b2533;--text:#f4f7fc;--muted:#9caec3;--line:#344155}body.light{color-scheme:light;--bg:#f3f6fb;--panel:#fff;--text:#15202d;--muted:#607184;--line:#d9e1eb}*{box-sizing:border-box}body{background:var(--bg);color:var(--text);margin:0}main{max-width:510px;margin:auto;padding:16px 14px 35px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}h1{font-size:21px;margin:0}small,.muted{color:var(--muted)}button{cursor:pointer}header button,.secondary{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:10px 13px}#reader{background:#080d13;border-radius:17px;overflow:hidden;min-height:190px}#reader video{width:100%!important;object-fit:cover}#reader button,#reader select{padding:8px;border-radius:7px}#status{margin:12px 0;padding:14px;border-radius:12px;background:var(--panel);font-weight:750}#status.ok{background:#123d2b;color:#8cf0b5}#status.bad{background:#4a1d25;color:#ffb0bd}#status.wait{background:#42331c;color:#ffd68c}.photo{height:min(47vh,380px);min-height:230px;border-radius:15px;background:var(--panel);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.photo img{width:100%;height:100%;object-fit:contain}.photo .placeholder{color:var(--muted);text-align:center;padding:20px}.gallery{display:flex;justify-content:center;align-items:center;gap:16px;margin:11px 0}.gallery button{font-size:22px;min-width:48px}.article{font-size:24px;font-weight:750;overflow-wrap:anywhere;margin:12px 0}.inputrow{display:flex;gap:8px;margin:14px 0}.inputrow input{min-width:0;flex:1;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px;color:var(--text);font-size:16px}.primary{background:#6a60ee;color:white;border:0;border-radius:11px;padding:12px 15px;font-weight:700}.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}.hidden{display:none!important}
</style></head><body><main><header><div><h1>WB Scanner <span style="font-size:12px;color:var(--muted)">Lite</span></h1><small id="catalogInfo">Загрузка каталога…</small></div><button id="theme" aria-label="Сменить тему">☀ / ☾</button></header><div id="reader"></div><div id="status">Наведите камеру на штрихкод</div><section><div class="photo" id="photo"><div class="placeholder">Здесь появится фотография товара</div></div><div class="gallery"><button class="secondary" id="prev" aria-label="Предыдущее фото">‹</button><span id="counter" class="muted">—</span><button class="secondary" id="next" aria-label="Следующее фото">›</button></div><div class="article" id="article">—</div></section><form class="inputrow" id="manual"><input id="barcode" inputmode="numeric" autocomplete="off" placeholder="Введите штрихкод вручную" aria-label="Штрихкод"><button class="primary" type="submit">Найти</button></form><div class="foot" id="cameraInfo">Для камеры нужен HTTPS и разрешение браузера.</div></main><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script>
let catalog={},last='',photoUrls=[],photoIndex=0,requestId=0,scanner;const el=id=>document.getElementById(id);const ranges=[[143,1],[287,2],[431,3],[719,4],[1007,5],[1061,6],[1115,7],[1169,8],[1313,9],[1601,10],[1655,11],[1919,12],[2045,13],[2189,14],[2405,15],[2621,16],[2837,17],[3053,18],[3269,19],[3485,20],[3701,21],[3917,22],[4133,23],[4349,24],[4565,25],[4781,26],[4997,27],[5213,28],[5429,29],[5645,30]];
function setStatus(message,kind=''){el('status').textContent=message;el('status').className=kind}function resetPhoto(message){el('photo').innerHTML='<div class="placeholder"></div>';el('photo').firstChild.textContent=message;el('counter').textContent='—'}function urlFor(id,basket,n){const v=Math.floor(id/100000),p=Math.floor(id/1000);return `https://basket-${String(basket).padStart(2,'0')}.wbbasket.ru/vol${v}/part${p}/${id}/images/big/${n}.webp`}
function loadImg(url,timeout=3200){return new Promise(resolve=>{const img=new Image();let done=false;const finish=ok=>{if(done)return;done=true;clearTimeout(timer);img.onload=img.onerror=null;resolve(ok)};const timer=setTimeout(()=>finish(false),timeout);img.onload=()=>finish(true);img.onerror=()=>finish(false);img.src=url})}
async function getBasket(id,token){let v=Math.floor(id/100000),candidate=(ranges.find(r=>v<=r[0])||[])[1];let order=[candidate,...Array.from({length:40},(_,i)=>i+1)].filter((x,i,a)=>x&&a.indexOf(x)===i);for(const b of order){if(token!==requestId)return null;if(await loadImg(urlFor(id,b,1),1800))return b}return null}
function renderPhoto(){if(!photoUrls.length){resetPhoto('Фотографии не найдены');return}const image=document.createElement('img');image.alt='Фотография товара';image.src=photoUrls[photoIndex];image.onerror=()=>resetPhoto('Ошибка загрузки фотографии');el('photo').replaceChildren(image);el('counter').textContent=`${photoIndex+1} из ${photoUrls.length}`}
async function show(code){code=String(code).trim();if(!code)return;if(code===last)return;last=code;const token=++requestId;photoUrls=[];photoIndex=0;el('article').textContent='—';resetPhoto('Поиск товара…');const item=catalog[code];if(!item){setStatus('ШТРИХКОД НЕ НАЙДЕН','bad');resetPhoto('Нет товара в справочнике');return}el('article').textContent=item.seller;setStatus('ТОВАР НАЙДЕН','ok');const basket=await getBasket(item.wb,token);if(token!==requestId)return;if(!basket){setStatus('ТОВАР НАЙДЕН · фотографии недоступны','wait');resetPhoto('Не удалось получить фотографии с WB');return}photoUrls=[urlFor(item.wb,basket,1)];renderPhoto();for(let i=2;i<=20;i++){if(token!==requestId)return;const url=urlFor(item.wb,basket,i);if(await loadImg(url,1400)){photoUrls.push(url);el('counter').textContent=`${photoIndex+1} из ${photoUrls.length}`}else break}}
let recentCode='',recentAt=0;function onScan(code){const now=Date.now();if(code===recentCode&&now-recentAt<1800)return;recentCode=code;recentAt=now;if(code!==last)show(code)}
async function start(){if(!window.Html5Qrcode){el('cameraInfo').textContent='Не удалось загрузить библиотеку камеры. Проверьте интернет.';return}try{scanner=new Html5Qrcode('reader',{verbose:false});await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:125},formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.UPC_A]},onScan,()=>{});el('cameraInfo').textContent='Камера активна · сканирование непрерывное'}catch(e){el('cameraInfo').textContent='Камера недоступна: '+(e?.message||e)+'. Можно ввести штрихкод вручную.'}}
el('manual').onsubmit=e=>{e.preventDefault();last='';show(el('barcode').value)};el('prev').onclick=()=>{if(photoUrls.length){photoIndex=(photoIndex+photoUrls.length-1)%photoUrls.length;renderPhoto()}};el('next').onclick=()=>{if(photoUrls.length){photoIndex=(photoIndex+1)%photoUrls.length;renderPhoto()}};let x=0;el('photo').addEventListener('touchstart',e=>x=e.changedTouches[0].clientX,{passive:true});el('photo').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x;if(Math.abs(d)>45)(d<0?el('next'):el('prev')).click()},{passive:true});el('theme').onclick=()=>{document.body.classList.toggle('light');localStorage.setItem('wb-theme',document.body.classList.contains('light')?'light':'dark')};if(localStorage.getItem('wb-theme')==='light')document.body.classList.add('light');fetch('catalog.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{catalog=data;el('catalogInfo').textContent=`В справочнике ${Object.keys(data).length} штрихкодов`;start()}).catch(e=>{setStatus('Ошибка загрузки справочника: '+e.message,'bad');start()});
</script></body></html>
